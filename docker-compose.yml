services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcendence_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcendence_net

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    # Bound to loopback, not 0.0.0.0: nginx is the only public entrypoint, and
    # a network-reachable plain-HTTP backend could forge X-Forwarded-Proto.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    # node_modules lives in a named volume so the bind mount above doesn't hide
    # it, but that volume outlives package.json changes. Installing on start
    # keeps it in sync instead of failing with a stale dependency tree.
    command: sh -c "npm install && npm run dev -- --host"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - transcendence_net

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence_net

  celery_beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence_net

  nginx:
    build: ./nginx
    restart: unless-stopped
    volumes:
      - nginx_certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence_net

volumes:
  mysql_data:
  frontend_node_modules:
  nginx_certs:

networks:
  transcendence_net:
