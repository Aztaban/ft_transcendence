name: frontend

on:
  push:
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Same image as the frontend container: the lockfile pins musl-specific
    # binaries (rollup), which a glibc runner cannot install.
    container: node:20-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npx tsc --noEmit
      - run: npm test
