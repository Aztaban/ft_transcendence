name: docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same .env a developer gets: random secret key (the backend refuses the example one).
      - run: make env
      - run: docker compose build
      # The one-command start the subject requires, checked end to end through nginx.
      - run: docker compose up -d
      - name: Smoke test through nginx
        run: scripts/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=200
      - run: docker compose down -v
        if: always()

  # The production profile (`make prod`): built frontend, Daphne, DEBUG off.
  docker-prod:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - run: make env
      - run: docker compose up -d --build
      - name: Smoke test through nginx
        run: scripts/smoke-test.sh prod
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
